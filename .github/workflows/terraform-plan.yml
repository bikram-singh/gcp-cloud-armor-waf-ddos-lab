name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # FIX (confirmed via real first-run failure): TF_TOKEN_APP_TERRAFORM_IO
    # was previously only set on individual steps, but GitHub Actions env
    # vars do NOT persist across steps unless set here, at the job level.
    # The "terraform init" step never had it, causing a real, confirmed
    # "Required token could not be found" failure on this workflow's
    # actual first trigger.
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive ../../
        continue-on-error: true

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Format \`${{ steps.fmt.outcome }}\`
            #### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
