name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

# Avoid piling up redundant plans if someone pushes multiple commits fast
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the plan as a PR comment

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodule checkout needed here — Terraform doesn't touch
        # vulnerable-app's content directly, only the pre-built image tag.

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true # wraps stdout/exitcode into step outputs, used below
        env:
          # HCP Terraform API token — add as a repo secret named exactly
          # this (Settings > Secrets and variables > Actions). Generate it
          # from your HCP Terraform user settings > Tokens.
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive ../../
        continue-on-error: true

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
          FMT_OUTCOME: "${{ steps.fmt.outcome }}"
        with:
          script: |
            const output = `#### Terraform Format \`${{ steps.fmt.outcome }}\`
            #### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
