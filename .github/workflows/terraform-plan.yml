name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # This workspace uses HCP Terraform in LOCAL execution mode (state
    # storage only -- confirmed necessary earlier in this project since
    # Remote mode could not resolve ../../modules paths). Local mode does
    # NOT auto-inject the workspace's stored Terraform variables the way
    # Remote mode does -- those only apply when HCP Terraform itself runs
    # the plan/apply. Since Actions is the one actually running Terraform
    # here (same as any local machine would), the two required variables
    # (project_id, vulnbank_image_tag) must be supplied explicitly via
    # TF_VAR_* environment variables. Locally this is handled by a
    # gitignored terraform.tfvars file, which of course does not exist in
    # a fresh Actions checkout -- confirmed via a real stuck run where
    # `terraform plan` hung waiting for an interactive prompt CI can never
    # answer.
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_project_id: ${{ vars.PROJECT_ID }}
      TF_VAR_vulnbank_image_tag: ${{ vars.VULNBANK_IMAGE_TAG }}

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: true

      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive ../../
        continue-on-error: true

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Format \`${{ steps.fmt.outcome }}\`
            #### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
