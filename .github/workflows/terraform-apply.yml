name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to confirm you want to apply to the lab environment'
        required: true
        type: string

jobs:
  apply:
    name: Apply (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Guard — require explicit confirmation
        if: github.event.inputs.confirm != 'apply'
        run: |
          echo "::error::You must type 'apply' in the confirm field to run this workflow. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

  # NOTE: -auto-approve here approves the plan from the Actions side. If
  # your HCP Terraform workspace is set to "Manual apply" (the default for
  # most workspaces), the actual apply still pauses in HCP Terraform's own
  # UI for a human confirmation there, regardless of this flag. Set the
  # workspace to auto-apply if you want this workflow to be fully
  # unattended — see docs/iam-least-privilege.md for why that trade-off
  # matters for who can trigger this workflow.
