name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the exact project ID (e.g. "project-cloud-armor") to confirm teardown'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_project_id: ${{ vars.PROJECT_ID }}
      TF_VAR_vulnbank_image_tag: ${{ vars.VULNBANK_IMAGE_TAG }}

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1022520543411/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
          service_account: "github-actions-ci@project-cloud-armor.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Guard -- confirmation must match the real project ID
        env:
          PROJECT_ID_EXPECTED: ${{ vars.PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$PROJECT_ID_EXPECTED" ]; then
            echo "::error::Confirmation did not match the expected project ID. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false

# Requires two repository VARIABLES: PROJECT_ID, VULNBANK_IMAGE_TAG.
# Requires the github-actions-ci service account (Workload Identity
# Federation, no key file -- this org's policy blocks key creation).
