name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the exact project ID (e.g. "project-cloud-armor") to confirm teardown'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # See terraform-plan.yml's comment: Local execution mode needs
    # TF_VAR_* supplied explicitly, confirmed via a real stuck run.
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      TF_VAR_project_id: ${{ vars.PROJECT_ID }}
      TF_VAR_vulnbank_image_tag: ${{ vars.VULNBANK_IMAGE_TAG }}

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Guard -- confirmation must match the real project ID
        env:
          PROJECT_ID_EXPECTED: ${{ vars.PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$PROJECT_ID_EXPECTED" ]; then
            echo "::error::Confirmation did not match the expected project ID. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      - name: Terraform destroy
        run: terraform destroy -auto-approve -input=false

# Requires two repository VARIABLES (not secrets), under Settings >
# Secrets and variables > Actions > Variables tab:
#   PROJECT_ID          = project-cloud-armor
#   VULNBANK_IMAGE_TAG   = <your pinned vuln-bank commit hash>
