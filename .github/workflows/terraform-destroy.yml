name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the exact project ID (e.g. "project-cloud-armor") to confirm teardown'
        required: true
        type: string

jobs:
  destroy:
    name: Destroy (lab environment)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # FIX: see terraform-plan.yml's comment -- job-level env, not per-step,
    # confirmed necessary after a real first-run failure on that workflow.
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}

    defaults:
      run:
        working-directory: terraform/environments/lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Guard -- confirmation must match the real project ID
        env:
          PROJECT_ID_EXPECTED: ${{ vars.PROJECT_ID }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "$PROJECT_ID_EXPECTED" ]; then
            echo "::error::Confirmation did not match the expected project ID. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      - name: Terraform destroy
        run: terraform destroy -auto-approve

# Requires a repository VARIABLE (not secret) named PROJECT_ID set to your
# project id (e.g. project-cloud-armor), under Settings > Secrets and
# variables > Actions > Variables tab.
